<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // function -it is a building blocks of application.

        // basic function-

        //  1.function declaration-

        function sum(a, b) {
            return a + b;
        }
        console.log(sum(4, 5));

        //    2. function without parameter-


        function add() {
            let sum1 = 3;
            let sum2 = 8;
            let res = sum1 + sum2;
            console.log(res);


        }
        add()

        //    3. function with parameter

        function Addition(num1, num2) {
            let result = num1 + num2;
            console.log(result);


        }
        Addition(4, 8);

        // 4. return keyword

        function addition(num3, num4) {
            return num3 + num4;

        }
        let resnum = addition(4, 5);
        console.log(resnum);

        //    5. Helper function 



        // 6.  Default parameter-

        function sumone(sum1 = 2, sum2 = 10) {
            return sum1 + sum2;
            console.log()

        }
        console.log(sumone(55, 5));
        console.log(sumone(15, 5));


        // 7.  Nested function- A function written inside another function.


        function calculate() {


            function addtwo(a, b) {
                return a + b;

            }
            let results = addtwo(4, 5);
            console.log(results)

        }
        calculate()

        // 8.   function expression- A function expression means assigning a function to a variable.


        function Additionthree(a, b) {
            return a + b;

        }
        let resone = Additionthree(1, 2);
        console.log(resone);


        // 9.   anonymous function- anonymous function is a function without a name.

        let print = function () {
            console.log("god is great");


        }
        print()

        // 10.  arrow function-

        let addfour = (a, b) => {

            let res = a + b;
            return res;

        };
        console.log(addfour(7, 8));





















        for (let i = 1; i <= 100; i = i + 2) {
            console.log(i);



        }











    </script>
</body>

</html>
